global:
  scrape_interval: 15s      # Как часто собирать метрики
  evaluation_interval: 15s  # Как часто проверять правила алертов

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'worker_flow_backend'
    # Если Prometheus будет в Docker, а бэкенд локально, здесь нужно будет 
    # указать host.docker.internal:8000 или IP контейнера бэкенда.
    # Пока оставим дефолтный localhost.
    static_configs:
      - targets: ['localhost:8000']
