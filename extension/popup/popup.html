<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <title>Worker Agent</title>
</head>
<body>
  <div class="header">
    <div class="logo">⚡ WORKER</div>
    <div id="connBadge" class="badge badge-off">DISCONNECTED</div>
  </div>

  <div class="field-group">
    <label>Server Endpoint:</label>
    <input type="text" id="serverUrl" value="http://localhost:8000">
  </div>

  <div class="field-group" style="display:flex; justify-content:space-between; align-items:center;">
    <label style="margin:0;">Глубина страниц:</label>
    <input type="number" id="pagesDepth" value="3" min="1" max="10" style="width: 50px;">
  </div>

  <div class="stats-box">
    <div>Очередь: <b id="queueCount">0</b></div>
    <div>Сегодня: <b id="todayCount">0</b></div>
  </div>

  <div class="actions">
    <button id="collectBtn" class="btn btn-secondary">1. Собрать ссылки</button>
    <button id="toggleBtn" class="btn btn-primary">2. Запустить агент</button>
  </div>

  <div id="statusLog" class="log">Готов к работе.</div>

  <a href="http://localhost:8000" target="_blank" class="footer-link">Открыть Control Hub ↗</a>

  <script src="popup.js"></script>
</body>
</html>
